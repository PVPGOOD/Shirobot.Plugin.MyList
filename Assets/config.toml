enabled = true
listen_prefix = "http://+:19089/"
listen_prefixes = []
require_authentication = true
username = "example-user"
password = "change-me-strong-password"
realm = "ShiroBot Virtual WebDAV"
welcome_text = "Hello from ShiroBot virtual WebDAV."
verbose_logging = false
upload_target_group_id = 0
upload_target_group_name = "网盘群"

# upload_mode:
# - "base64": 所有文件都使用 base64:// 上传，适合小文件
# - "file": 所有文件都使用 file:// 上传
# - "auto": 小于 upload_base64_threshold_mb 走 base64，大于等于阈值走 file
upload_mode = "file"
upload_base64_threshold_mb = 200

# file_transfer_mode:
# - "direct": file 模式直接使用当前机器本地临时文件路径，适合 Shirobot 与 Milky 在同一环境/同一路径可见的场景
# - "smb": file 模式先将文件复制到 SMB 共享目录，再映射为 Milky 机器可读取的本地路径，适合两端不在同一环境但共享文件可见的场景
file_transfer_mode = "smb"

# smb_write_root:
# 当前机器写入 SMB 文件时使用的路径。
# 仅在 file_transfer_mode = "smb" 时需要配置，direct 模式可忽略。
# 可使用两种形式：
# - 已挂载盘符路径，例如 "T:\\temp\\upload"
# - UNC 路径，例如 "\\\\nas\\ShirobotOpenList\\temp\\upload"
# 无论使用哪种形式，当前运行 ShiroBot 的账号都必须对该目录有创建目录、写入文件、删除文件的权限。
smb_write_root = ""

# smb_milky_root:
# 同一份 SMB 文件在 Milky 机器上的本地路径映射。
# 仅在 file_transfer_mode = "smb" 时需要配置，direct 模式可忽略
smb_milky_root = ""

# smb_username / smb_password:
# SMB 共享访问凭据。仅在 file_transfer_mode = "smb" 且使用 UNC 路径时，当前进程账号无法直接访问共享的情况下需要配置。
# 如果 smb_write_root 使用已挂载盘符，通常不需要再填写这两个字段。
# 用户名可直接写 "server\\user" 或 "user"。
smb_username = "EXAMPLE\\user"
smb_password = "change-me-smb-password"
